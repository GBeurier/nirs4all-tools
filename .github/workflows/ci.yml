name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  tools-gate:
    name: nirs4all-tools gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.15"
          cache: pip

      - name: Install package and gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,parquet]"

      - name: Ruff
        run: ruff check .

      - name: Typecheck
        run: mypy

      - name: Tests
        run: pytest
