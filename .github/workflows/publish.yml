name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = build only (no publish)"
        type: string
        default: "true"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      package_version: ${{ steps.package_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11.15"

      - name: Read package version
        id: package_version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path

          text = Path("src/nirs4all_tools/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'^__version__ = "([^"]+)"$', text, re.MULTILINE)
          if not match:
              raise SystemExit("Could not find __version__ in src/nirs4all_tools/__init__.py")
          print(f"version={match.group(1)}")
          PY

      - name: Verify publish ref matches package version
        if: github.event_name == 'release' || inputs.dry_run == 'false'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PACKAGE_VERSION: ${{ steps.package_version.outputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python - <<'PY'
          import os

          package_version = os.environ["PACKAGE_VERSION"]
          expected_tag = f"v{package_version}"
          event_name = os.environ["EVENT_NAME"]

          if event_name == "release":
              actual_tag = os.environ["RELEASE_TAG"]
              if actual_tag != expected_tag:
                  raise SystemExit(
                      f"Release tag {actual_tag!r} does not match package version {package_version!r} "
                      f"(expected {expected_tag!r})."
                  )
          else:
              ref_type = os.environ["REF_TYPE"]
              ref_name = os.environ["REF_NAME"]
              if ref_type != "tag":
                  raise SystemExit(
                      "Manual publish requires running workflow_dispatch from a tag ref; "
                      f"got ref_type={ref_type!r}, ref_name={ref_name!r}."
                  )
              if ref_name != expected_tag:
                  raise SystemExit(
                      f"Manual publish tag {ref_name!r} does not match package version {package_version!r} "
                      f"(expected {expected_tag!r})."
                  )
          PY

      - name: Build sdist + wheel
        run: |
          python -m pip install build==1.6.0 twine==7.0.0
          python scripts/build_release.py --outdir dist-a
          python scripts/build_release.py --outdir dist-b
          python - <<'PY'
          from pathlib import Path
          import shutil

          first = {path.name: path for path in Path("dist-a").iterdir()}
          second = {path.name: path for path in Path("dist-b").iterdir()}
          if first.keys() != second.keys():
              raise SystemExit("A/B builds produced different artifact inventories")
          output = Path("dist")
          output.mkdir()
          for name, first_path in sorted(first.items()):
              if first_path.read_bytes() != second[name].read_bytes():
                  raise SystemExit(f"A/B artifact mismatch: {name}")
              shutil.copy2(first_path, output / name)
          PY
          python -m twine check dist/*

      - name: Write release SBOM
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python scripts/write_release_sbom.py \
            --dist-dir dist \
            --source-commit "$SOURCE_COMMIT" \
            --output release-metadata/nirs4all-tools.cdx.json

      - name: Smoke-check wheel
        run: |
          python -m pip install dist/*.whl
          nirs4all-tools --help

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-metadata
          path: release-metadata/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    if: github.event_name == 'release' || inputs.dry_run == 'false'
    environment:
      name: pypi
      url: https://pypi.org/p/nirs4all-tools
    permissions:
      id-token: write
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/

      - name: Validate Trusted Publisher release tuple
        run: |
          set -euo pipefail
          expected_repo="GBeurier/nirs4all-tools"
          if [[ "${GITHUB_REPOSITORY}" != "${expected_repo}" ]]; then
            echo "::error::PyPI Trusted Publisher for project nirs4all-tools must target owner=GBeurier repo=nirs4all-tools workflow=publish.yml environment=pypi; current repository is ${GITHUB_REPOSITORY}." >&2
            exit 1
          fi
          case "${GITHUB_WORKFLOW_REF}" in
            */.github/workflows/publish.yml@*)
              ;;
            *)
              echo "::error::Expected GITHUB_WORKFLOW_REF to point at .github/workflows/publish.yml, got ${GITHUB_WORKFLOW_REF}." >&2
              exit 1
              ;;
          esac

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
